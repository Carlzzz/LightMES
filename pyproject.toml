[project]
name = "lightmes"
version = "0.1.0"
description = "Lightweight MES for notebook shell assembly line"
readme = "README.md"
authors = [
    { name = "Carlzzz", email = "1757947926@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.3.0,<3.0",
    "alembic>=1.18.5",
    "asyncua>=1.9.0",
    "cryptography>=45.0.0",
    "fastapi>=0.141.1",
    "fastmcp>=2.0,<3.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymodbus>=3.7.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
