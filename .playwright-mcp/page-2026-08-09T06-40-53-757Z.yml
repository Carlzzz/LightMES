  - main [ref=f2e10]: "<h1 class=\"page-title\">首检配置 <small>关键工位首件检查</small></h1> <div class=\"page-header-links\"> <a href=\"/\" class=\"btn-secondary btn-sm\">← 返回首页</a> </div> <div class=\"card\"> <div class=\"card__title\">配置列表</div> <table class=\"data-table\"> <thead> <tr> <th>ID</th> <th>名称</th> <th>工序</th> <th>作业站</th> <th>触发条件</th> <th>状态</th> <th></th> </tr> </thead> <tbody> <tr> <td>1</td> <td>OP20首检</td> <td>核心部件装配</td> <td>不限</td> <td> <div class=\"wip-status-grid\" style=\"gap: 4px; display: flex; flex-wrap: wrap;\"> <span class=\"badge\">新工单</span> </div> </td> <td><span class=\"badge\">启用</span></td> <td><a href=\"/quality/first-inspection/1\" class=\"btn-secondary btn-sm\">配置检查项</a></td> </tr> </tbody> </table> </div> <div class=\"card\"> <div class=\"card__title\">新建配置</div> <form class=\"form-row\" hx-post=\"/quality/first-inspection\" hx-target=\"body\" style=\"flex-wrap: wrap; align-items: flex-end; gap: 12px;\"> <div class=\"field\" style=\"min-width: 180px;\"> <label>配置名称</label> <input type=\"text\" name=\"name\" required placeholder=\"如：OP20首检\"> </div> <div class=\"field\" style=\"min-width: 180px;\"> <label>工序</label> <select name=\"operation_id\" required> <option value=\"\">请选择工序</option> <option value=\"1\">OP10 - 上线准备</option> <option value=\"2\">OP20 - 核心部件装配</option> <option value=\"3\">OP30 - 性能测试</option> <option value=\"4\">OP40 - 包装入库</option> </select> </div> <div class=\"field\" style=\"min-width: 180px;\"> <label>作业站（可选）</label> <select name=\"work_station_id\"> <option value=\"\">不限</option> <option value=\"1\">WS-01 - 上线工位</option> <option value=\"2\">WS-02 - 核心装配工位</option> <option value=\"3\">WS-03 - 测试包装工位</option> </select> </div> <div class=\"field\" style=\"min-width: 100px;\"> <label>首检数量</label> <input type=\"number\" name=\"sample_size\" value=\"1\" min=\"1\"> </div> <div class=\"field\" style=\"min-width: 300px; display: flex; flex-direction: column; gap: 4px;\"> <label>触发条件</label> <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\"> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"t1\" name=\"trigger_new_order\" checked> <label for=\"t1\" style=\"font-size: 12px;\">新工单</label> </div> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"t2\" name=\"trigger_material_change\"> <label for=\"t2\" style=\"font-size: 12px;\">物料变更</label> </div> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"t3\" name=\"trigger_tooling_change\"> <label for=\"t3\" style=\"font-size: 12px;\">工装变更</label> </div> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"t4\" name=\"trigger_shift_handover\"> <label for=\"t4\" style=\"font-size: 12px;\">交接班</label> </div> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"t5\" name=\"trigger_cold_start\"> <label for=\"t5\" style=\"font-size: 12px;\">冷启动</label> </div> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"t6\" name=\"trigger_previous_failed\"> <label for=\"t6\" style=\"font-size: 12px;\">前序失败</label> </div> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"t7\" name=\"trigger_param_revision\"> <label for=\"t7\" style=\"font-size: 12px;\">参数修订</label> </div> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"t8\" name=\"trigger_abnormal_restart\"> <label for=\"t8\" style=\"font-size: 12px;\">异常重启</label> </div> </div> </div> <div class=\"field\" style=\"min-width: 200px; display: flex; flex-direction: column; gap: 4px;\"> <label>选项</label> <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\"> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"e1\" name=\"is_enabled\" checked> <label for=\"e1\" style=\"font-size: 12px;\">启用</label> </div> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"a1\" name=\"require_authorization\"> <label for=\"a1\" style=\"font-size: 12px;\">需授权放行</label> </div> <div style=\"display: flex; gap: 4px; align-items: center;\"> <input type=\"checkbox\" id=\"q1\" name=\"quarantine_on_fail\"> <label for=\"q1\" style=\"font-size: 12px;\">失败隔离</label> </div> </div> </div> <button type=\"submit\">创建配置</button> </form> </div>"