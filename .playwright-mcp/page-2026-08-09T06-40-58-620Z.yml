<option value=\"text\">文本</option> </select> </div> <div class=\"field\" style=\"min-width: 100px;\"> <label>单位</label> <input type=\"text\" name=\"unit\" placeholder=\"可选\"> </div> <div class=\"field\" style=\"min-width: 100px;\"> <label>标准值</label> <input type=\"text\" name=\"standard_value\" placeholder=\"可选\"> </div> <div class=\"field\" style=\"min-width: 100px;\"> <label>最小值</label> <input type=\"number\" step=\"0.001\" name=\"min_value\" placeholder=\"可选\"> </div> <div class=\"field\" style=\"min-width: 100px;\"> <label>最大值</label> <input type=\"number\" step=\"0.001\" name=\"max_value\" placeholder=\"可选\"> </div> <div class=\"field\" style=\"min-width: 100px; display: flex; flex-direction: column; gap: 4px;\"> <label>&nbsp;</label> <div style=\"display: flex; gap: 8px; align-items: center;\"> <input type=\"checkbox\" id=\"is_mandatory\" name=\"is_mandatory\" checked> <label for=\"is_mandatory\" style=\"font-size: 12px;\">必检</label> </div> </div> <button type=\"submit\">添加</button> </form> </div> </div>"