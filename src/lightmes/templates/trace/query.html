{% extends "base.html" %}
{% block title %}追溯查询{% endblock %}
{% block content %}
<h1 class="page-title">追溯查询</h1>

<div class="card">
  <div class="card__title">查询条件</div>
  <form class="form-row" hx-post="/trace/query" hx-target="#result" hx-swap="innerHTML">
    <div class="field"><label>查询类型</label>
      <select name="query_type">
        <option value="genealogy">正向：成品 SN → 组件</option>
        <option value="where_used_sn">反向：组件 SN → 成品</option>
        <option value="where_used_batch">反向：组件批次 → 成品</option>
        <option value="history">履历：成品 SN</option>
      </select>
    </div>
    <div class="field" style="flex:1"><label>SN / 批次号</label>
      <input name="value" placeholder="输入 SN 或批次号" required>
    </div>
    <button type="submit">查询</button>
  </form>
  <div id="result" class="result-slot"></div>
</div>
{% endblock %}
