{% extends "base.html" %}
{% block title %}返工 / 拆解{% endblock %}
{% block content %}
<h1 class="page-title">返工 / 拆解</h1>

<div class="card">
  <div class="card__title">发起返工</div>
  <form class="form-row" hx-post="/trace/rework" hx-target="#result" hx-swap="innerHTML">
    <div class="field"><label>成品 SN</label><input name="sn" placeholder="要返工的成品 SN" required></div>
    <div class="field"><label>回退到工序序号</label><input name="target_seq" type="number" placeholder="如 1" required></div>
    <div class="field" style="flex:1"><label>返工原因</label><input name="reason" placeholder="可选"></div>
    <button type="submit">返工</button>
  </form>
  <div id="result" class="result-slot"></div>
</div>

<div class="card">
  <div class="card__title">说明</div>
  <div class="nav-card__desc">
    返工会把该 SN 回退到指定工序、置为「返工中」，之后可在扫码工位从该工序之后重新过站。
    返工不影响已保留的过站与谱系历史。
  </div>
</div>
{% endblock %}
