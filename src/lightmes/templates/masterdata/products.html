{% extends "base.html" %}
{% block title %}产品管理{% endblock %}
{% block content %}
<h1 class="page-title">产品管理</h1>

<div class="card">
  <div class="card__title">新增产品</div>
  <form class="form-row" hx-post="/masterdata/products" hx-target="#rows" hx-swap="beforeend"
        hx-on::after-request="if(event.detail.successful) this.reset()">
    <div class="field"><label>编码</label><input name="code" placeholder="如 NBK-SHELL-A" required></div>
    <div class="field"><label>名称</label><input name="name" placeholder="产品名称" required></div>
    <div class="field"><label>类型</label>
      <select name="type">
        <option value="finished">成品</option>
        <option value="semi">半成品</option>
        <option value="component">组件</option>
        <option value="consumable">辅料</option>
      </select>
    </div>
    <div class="field"><label>单位</label><input name="unit" value="pcs"></div>
    <div class="field"><label>追踪方式</label>
      <select name="track_mode">
        <option value="none">不追踪</option>
        <option value="serial">唯一件</option>
        <option value="batch">批次</option>
      </select>
    </div>
    <button type="submit">新增</button>
  </form>
</div>

<div class="card">
  <div class="card__title">产品列表</div>
  <table class="data-table">
    <thead><tr><th>ID</th><th>编码</th><th>名称</th><th>类型</th><th>单位</th><th>追踪</th><th>来源</th></tr></thead>
    <tbody id="rows">
      {% for product in products %}{% include "masterdata/partials/product_row.html" %}{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
