<tr>
  <td>{{ product.id }}</td>
  <td>{{ product.code }}</td>
  <td>{{ product.name }}</td>
  <td>{{ product.type }}</td>
  <td>{{ product.unit }}</td>
  <td>{{ product.track_mode }}</td>
  <td>{% if product.source == "erp" %}<span class="badge">ERP</span>{% else %}<span class="badge">本地</span>{% endif %}</td>
</tr>
