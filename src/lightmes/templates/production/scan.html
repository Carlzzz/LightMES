{% extends "base.html" %}
{% block title %}扫码过站{% endblock %}
{% block content %}
<h1 class="page-title">扫码过站 <small>当前作业站 #{{ work_station_id }}</small></h1>

<div class="card">
  <div class="card__title">过站扫描</div>
  <form class="form-row" hx-post="/production/scan" hx-target="#result" hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) this.querySelector('[name=code_or_sn]').value=''">
    <div class="field"><label>作业站</label><input name="work_station_id" value="{{ work_station_id }}"></div>
    <div class="field" style="flex:1">
      <label>扫码 / 输入</label>
      <input name="code_or_sn" placeholder="首件填工单号，后续填 SN" required autofocus>
    </div>
    <button type="submit">过站</button>
  </form>
  <div id="result" class="result-slot"></div>
</div>

<div class="card">
  <div class="card__title">操作提示</div>
  <div class="nav-card__desc">
    首件：在工单起始工位输入<strong>工单号</strong>，系统自动生成 SN 并过站；
    后续工序：输入上一步得到的 <strong>SN</strong>。
    过站需符合工艺路线顺序（防跳站 / 防重复）。
  </div>
</div>
{% endblock %}
