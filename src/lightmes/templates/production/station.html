{% extends "base.html" %}
{% block title %}工位作业{% endblock %}
{% block container_class %}--station{% endblock %}
{% block content %}
<div class="station-shell">
  <div class="station-ready card">
    <div class="card__title">扫码进入</div>
    <form class="form-row" id="enter-form" hx-post="/production/station/enter" hx-target="#station-root" hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful && event.target && event.target.id === 'enter-form'){document.getElementById('enter-scan').value='';document.querySelector('.station-ready').classList.add('is-hidden');}">
      <div class="field"><label>作业站</label>
        <select id="station-ws-select" name="work_station_id" required
                onchange="if(this.value){document.querySelector('.station-ready').classList.remove('is-hidden');document.getElementById('station-root').innerHTML='';htmx.trigger(document.getElementById('station-wo-select'),'reset-wo');}">
          <option value="" disabled selected>- 选择作业站 -</option>
          {% for s in station_options %}
          <option value="{{ s.id }}" {% if s.id == work_station_id %}selected{% endif %}>{{ s.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field"><label>工单</label>
        <select id="station-wo-select" name="work_order_id" required
                style="width:200px"
                hx-get="/production/station/work-orders"
                hx-trigger="reset-wo from:body"
                hx-target="this"
                hx-swap="innerHTML"
                hx-include="#station-ws-select"
                onchange="document.querySelector('.station-ready').classList.remove('is-hidden');document.getElementById('station-root').innerHTML='';">
          <option value="" disabled selected>- 选择工单 -</option>
        </select>
      </div>
      <div class="field" style="flex:1;min-width:240px"><label>扫 SN / 载体码</label>
        <input id="enter-scan" name="scan" placeholder="首件扫载体码，后续扫 SN/载体码" required autofocus></div>
      <button type="submit">进入</button>
    </form>
    <div class="nav-card__desc">作业站选定后自动列出本产线可用工单；首件扫载体码即自动绑定 SN 进入主界面，再手动确认过站。</div>
  </div>
  <div id="station-root" class="station-root"></div>
  <div class="modal" id="andon-modal" style="display:none">
    <div class="modal__body"><div id="andon-modal-body"></div></div>
  </div>
</div>
<script>
  (function () {
    var wsSel = document.getElementById('station-ws-select');
    if (wsSel && wsSel.value) {
      htmx.trigger(document.getElementById('station-wo-select'), 'reset-wo');
    }
    // 报错返回后自动刷新工单列表（防止工单状态已变更但列表是旧数据）
    document.getElementById('station-root').addEventListener('htmx:afterSwap', function(e) {
      var html = e.detail.target.innerHTML || '';
      if (html.indexOf('alert--danger') >= 0 || html.indexOf('✗') >= 0) {
        htmx.trigger(document.getElementById('station-wo-select'), 'reset-wo');
      }
    });
  })();
</script>
{% endblock %}
