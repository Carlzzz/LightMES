{% extends "base.html" %}
{% block content %}
<h1>停机原因</h1>
<table>
  <thead><tr><th>ID</th><th>编码</th><th>名称</th><th>类型</th><th>系统</th></tr></thead>
  <tbody>
    {% for r in reasons %}
    <tr><td>{{ r.id }}</td><td>{{ r.code }}</td><td>{{ r.name }}</td><td>{{ r.kind }}</td><td>{{ r.is_system }}</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
