{% extends "base.html" %}
{% block title %}LightMES 控制台{% endblock %}
{% block content %}
<h1 class="page-title">生产控制台 <small>笔记本外壳组装 MES</small></h1>

<div class="card">
  <div class="card__title">主数据</div>
  <div class="nav-grid">
    <a class="nav-card" href="/masterdata/products">
      <span class="nav-card__icon">📦</span>
      <div class="nav-card__name">产品管理</div>
      <div class="nav-card__desc">成品、组件、辅料</div>
    </a>
    <a class="nav-card" href="/masterdata/stations">
      <span class="nav-card__icon">🏭</span>
      <div class="nav-card__name">工位管理</div>
      <div class="nav-card__desc">产线工位配置</div>
    </a>
  </div>
</div>

<div class="card">
  <div class="card__title">生产执行</div>
  <div class="nav-grid">
    <a class="nav-card" href="/production/scan?station_id=0">
      <span class="nav-card__icon">📲</span>
      <div class="nav-card__name">扫码过站</div>
      <div class="nav-card__desc">工单/SN 扫码过站</div>
    </a>
    <a class="nav-card" href="/production/wip?work_order_id=0">
      <span class="nav-card__icon">📊</span>
      <div class="nav-card__name">WIP 看板</div>
      <div class="nav-card__desc">在制品实时状态</div>
    </a>
  </div>
</div>

<div class="card">
  <div class="card__title">追溯管理</div>
  <div class="nav-grid">
    <a class="nav-card" href="/trace/query">
      <span class="nav-card__icon">🔍</span>
      <div class="nav-card__name">追溯查询</div>
      <div class="nav-card__desc">履历 · 正向 · 反向召回</div>
    </a>
    <a class="nav-card" href="/trace/rework">
      <span class="nav-card__icon">🔧</span>
      <div class="nav-card__name">返工 / 拆解</div>
      <div class="nav-card__desc">回退工序、解绑组件</div>
    </a>
  </div>
</div>
{% endblock %}
